<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
html{background:#fafafa;}
body{width:720pt;height:405pt;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.content{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80pt;}
.eyebrow{font-family:'Courier New',monospace;font-size:11pt;color:#888888;letter-spacing:1.5px;margin-bottom:18pt;text-align:center;}
.title{font-size:48pt;font-weight:600;color:#171717;letter-spacing:-2.4px;line-height:1;text-align:center;margin-bottom:20pt;}
.title span{color:#007cf0;}
.sub{font-size:17pt;font-weight:400;color:#4d4d4d;text-align:center;line-height:1.5;max-width:520pt;}
.pill-wrap{display:flex;justify-content:center;margin-top:28pt;}
.pill{background:#171717;border-radius:100px;padding:5pt 14pt;display:inline-block;}
.pill-text{color:#ffffff;font-size:11pt;font-weight:500;}
.meta{position:absolute;bottom:28pt;right:36pt;font-family:'Courier New',monospace;font-size:10pt;color:#888888;}
</style>
</head>
<body>
<img class="bg" src="../hero-gradient.png"/>
<div class="content">
  <p class="eyebrow">FOOD DECISION SPRINT · DISCOVERY READOUT · 2026</p>
  <h1 class="title">Every day, <span>the same</span><br>blank.</h1>
  <p class="sub">How urban Indian professionals decide what to eat — and why they can't stop getting it wrong.</p>
  <div class="pill-wrap"><div class="pill"><p class="pill-text">Research · Synthesis · Opportunities</p></div></div>
</div>
<p class="meta">AI Design Sprint</p>
</body></html>
